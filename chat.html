<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPilot - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #09090b; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Floating Chat Button */
        .chat-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            z-index: 9999;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .chat-btn:hover { transform: scale(1.1); box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6); }
        .chat-btn svg { width: 28px; height: 28px; fill: white; }
        
        /* Chat Modal */
        .chat-modal {
            position: fixed;
            bottom: 100px;
            right: 24px;
            width: 380px;
            max-width: calc(100vw - 48px);
            background: #18181b;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            z-index: 9998;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #27272a;
        }
        .chat-modal.active { display: flex; }
        
        /* Chat Header */
        .chat-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header-info { flex: 1; }
        .chat-header-info h3 { color: white; font-size: 16px; margin-bottom: 2px; }
        .chat-header-info p { color: rgba(255,255,255,0.8); font-size: 12px; }
        .chat-close {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            transition: all .2s;
        }
        .chat-close:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }
        
        /* Chat Messages */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; animation: fadeInUp .3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.bot { background: #27272a; color: #fafafa; align-self: flex-start; border-bottom-left-radius: 6px; }
        .msg.user { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; align-self: flex-end; border-bottom-right-radius: 6px; }
        .msg .time { font-size: 10px; opacity: 0.5; margin-top: 6px; display: block; }
        
        /* Chat Form */
        .chat-form {
            padding: 16px;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-form input {
            flex: 1;
            padding: 12px 16px;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            color: #fafafa;
            font-size: 14px;
        }
        .chat-form input:focus { outline: none; border-color: #6366f1; }
        .chat-form button {
            padding: 12px 20px;
            background: #6366f1;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }
        .chat-form button:hover { background: #4f46e5; transform: scale(1.02); }
        .chat-form button:disabled { background: #3f3f46; cursor: not-allowed; transform: none; }
        
        /* Typing Indicator */
        .chat-typing { display: none; align-items: center; gap: 8px; padding: 8px 16px; color: #71717a; font-size: 12px; }
        .chat-typing.active { display: flex; }
        .chat-typing-dot { width: 6px; height: 6px; background: #6366f1; border-radius: 50%; animation: typingBounce 1.4s infinite ease-in-out; }
        .chat-typing-dot:nth-child(2) { animation-delay: .2s; }
        .chat-typing-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    </style>
</head>
<body>

<!-- Floating Chat Button -->
<div class="chat-btn" onclick="toggleChat()">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
</div>

<!-- Chat Modal -->
<div class="chat-modal active" id="chatModal">
    <div class="chat-header">
        <div class="chat-header-info">
            <h3>LeadPilot Assistant</h3>
            <p>Te responde al instante</p>
        </div>
        <button class="chat-close" onclick="toggleChat()">×</button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="msg bot">
            ¡Hola! 👋 Soy el asistente de LeadPilot. ¿En qué puedo ayudarte hoy?
        </div>
    </div>
    
    <div class="chat-typing" id="chatTyping">
        <span>Escribiendo</span>
        <div class="chat-typing-dot"></div>
        <div class="chat-typing-dot"></div>
        <div class="chat-typing-dot"></div>
    </div>
    
    <form class="chat-form" id="chatForm" onsubmit="sendMessage(event)">
        <input type="text" id="chatInput" placeholder="Escribe tu mensaje..." autocomplete="off">
        <button type="submit" id="sendBtn">Enviar</button>
    </form>
</div>

<script>
let isOpen = true;
let chatSessionId = null;
let processedResponses = new Set();

function toggleChat() {
    isOpen = !isOpen;
    const modal = document.getElementById('chatModal');
    modal.classList.toggle('active', isOpen);
}

function showTyping() { document.getElementById('chatTyping').classList.add('active'); }
function hideTyping() { document.getElementById('chatTyping').classList.remove('active'); }

async function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('sendBtn');
    const msg = input.value.trim();
    
    if (!msg) return;
    
    addMessage(msg, 'user');
    input.value = '';
    btn.disabled = true;
    showTyping();
    
    try {
        const resp = await fetch('https://nv96hw8d.functions.insforge.app/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: 'Chat Visitor',
                email: 'chat@leadpilot.es',
                company: '',
                message: msg,
                source: 'chat_page'
            })
        });
        const data = await resp.json();
        if (data.session_id) {
            chatSessionId = data.session_id;
        }
        hideTyping();
        addMessage('¡Mensaje enviado! Te responderemos pronto. 🚀', 'bot');
    } catch (err) {
        hideTyping();
        addMessage('Error al enviar. Intenta de nuevo.', 'bot');
    }
    
    btn.disabled = false;
}

function addMessage(text, type) {
    hideTyping();
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('es', {hour: '2-digit', minute: '2-digit'});
    div.innerHTML = type === 'bot' ? text : text;
    div.appendChild(time);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

async function pollResponses() {
    if (!chatSessionId) return;
    try {
        const resp = await fetch(`https://nv96hw8d.functions.insforge.app/api/contact/responses?session_id=${chatSessionId}`);
        const data = await resp.json();
        if (data.responses && data.responses.length > 0) {
            data.responses.forEach(r => {
                if (!processedResponses.has(r.session_id)) {
                    processedResponses.add(r.session_id);
                    if (r.bot_response) {
                        addMessage(r.bot_response, 'bot');
                    }
                }
            });
        }
    } catch (e) {}
}

setInterval(pollResponses, 3000);
</script>

</body>
</html>
