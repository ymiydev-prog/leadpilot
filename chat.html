<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPilot - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #09090b; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Floating Chat Button */
        .chat-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            z-index: 9999;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .chat-btn:hover { transform: scale(1.1); box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6); }
        .chat-btn svg { width: 28px; height: 28px; fill: white; }
        
        /* Chat Modal */
        .chat-modal {
            position: fixed;
            bottom: 100px;
            right: 24px;
            width: 380px;
            max-width: calc(100vw - 48px);
            background: #18181b;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            z-index: 9998;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #27272a;
        }
        .chat-modal.active { display: flex; }
        
        /* Chat Header */
        .chat-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); }
        .chat-header-info h3 { color: white; font-size: 16px; margin-bottom: 2px; }
        .chat-header-info p { color: rgba(255,255,255,0.8); font-size: 12px; }
        
        /* Chat Messages */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .msg.bot { background: #27272a; color: #fafafa; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.user { background: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        /* Chat Form */
        .chat-form {
            padding: 16px;
            border-top: 1px solid #27272a;
            display: flex;
            gap: 10px;
        }
        .chat-form input {
            flex: 1;
            padding: 12px 16px;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            color: #fafafa;
            font-size: 14px;
        }
        .chat-form input:focus { outline: none; border-color: #6366f1; }
        .chat-form button {
            padding: 12px 20px;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-form button:hover { background: #4f46e5; }
        .chat-form button:disabled { background: #3f3f46; cursor: not-allowed; }
        
        /* Success Message */
        .success-msg {
            text-align: center;
            padding: 40px 20px;
            color: #22c55e;
        }
        .success-msg .icon { font-size: 48px; margin-bottom: 16px; }
    </style>
</head>
<body>

<!-- Floating Chat Button -->
<div class="chat-btn" onclick="toggleChat()">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
</div>

<!-- Chat Modal -->
<div class="chat-modal" id="chatModal">
    <div class="chat-header">
        <img src="/assets/logo.svg" alt="LeadPilot" onerror="this.style.display='none'">
        <div class="chat-header-info">
            <h3>LeadPilot Assistant</h3>
            <p>Typically replies instantly</p>
        </div>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="msg bot">
            ¡Hola! 👋 Soy el asistente de LeadPilot. ¿En qué puedo ayudarte hoy?
        </div>
    </div>
    
    <form class="chat-form" id="chatForm" onsubmit="sendMessage(event)">
        <input type="text" id="chatInput" placeholder="Escribe tu mensaje..." autocomplete="off">
        <button type="submit" id="sendBtn">Enviar</button>
    </form>
</div>

<script>
let isOpen = false;

function toggleChat() {
    isOpen = !isOpen;
    const modal = document.getElementById('chatModal');
    modal.classList.toggle('active', isOpen);
}

async function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('sendBtn');
    const msg = input.value.trim();
    
    if (!msg) return;
    
    // Add user message
    addMessage(msg, 'user');
    input.value = '';
    btn.disabled = true;
    
    // Send to backend
    try {
        const resp = await fetch('https://leadpilot.es/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: 'Chat Visitor',
                email: 'chat@leadpilot.es',
                company: '',
                message: msg,
                source: 'chat_page'
            })
        });
        const data = await resp.json();
        if (data.session_id) {
            chatSessionId = data.session_id;
        }
        
        // Add bot confirmation
        addMessage('¡Mensaje enviado! Te responderemos pronto. 🚀', 'bot');
    } catch (err) {
        addMessage('Error al enviar. Intenta de nuevo.', 'bot');
    }
    
    btn.disabled = false;
}

function addMessage(text, type) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.innerHTML = type === 'bot' ? text : text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

let chatSessionId = null;
let processedResponses = new Set();

async function pollResponses() {
    if (!chatSessionId) return;
    try {
        const resp = await fetch(`https://leadpilot.es/api/contact/responses?session_id=${chatSessionId}`);
        const data = await resp.json();
        if (data.responses && data.responses.length > 0) {
            data.responses.forEach(r => {
                if (!processedResponses.has(r.session_id)) {
                    processedResponses.add(r.session_id);
                    if (r.bot_response) {
                        addMessage(r.bot_response, 'bot');
                    }
                }
            });
        }
    } catch (e) {}
}

setInterval(pollResponses, 3000);

// Auto-open after 3 seconds
setTimeout(() => {
    if (!isOpen) toggleChat();
}, 3000);
</script>

</body>
</html>
